name: annales-integration

services:
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: annales_it_admin
      MINIO_ROOT_PASSWORD: annales_it_test_password_928374
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - integration_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  init-bucket:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: annales_it_admin
      MINIO_ROOT_PASSWORD: annales_it_test_password_928374
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set integration http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing integration/annales-integration
        echo "Integration-test bucket is ready."

volumes:
  integration_data:
    name: annales_integration_data
