services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: annales_bench
      MINIO_ROOT_PASSWORD: annales_bench_password
    ports:
      - "9000:9000"
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-bucket:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 annales_bench annales_bench_password &&
        mc mb --ignore-existing local/annales-benchmark
      "

  annales:
    build: .
    ports:
      - "8080:8080"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: annales-benchmark
      AWS_ACCESS_KEY_ID: annales_bench
      AWS_SECRET_ACCESS_KEY: annales_bench_password
      ANNALES_ADDR: :8080
    depends_on:
      init-bucket:
        condition: service_completed_successfully
